<!DOCTYPE html>
<html>
	<head>
		<title>Shop</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- BOOTSTRAP CSS -->
		<link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />

		<!-- SHOP STYLE CSS -->
		<link rel="stylesheet" href="shop-style.css" />

		<!-- BOOTSTRAP JS -->
		<script src="bootstrap/js/bootstrap.bundle.min.js"></script>
	</head>

	<body>

		<!-- SHOP TITLE -->
		 <div class="row">
			<div class="col text-center">

				<!-- SHOP AWNING -->
				 <div class="awning">
				<h1 class="shop-title">THE GOOBIE SHOP</h1>
				</div>
			</div>
		 </div>
		<!-- <div class="bg-primary text-white"> Goobie Shop </div> -->

		<!-- SHOP WALL -->
		<div class="shop-wall">

			<!-- SHOP WINDOW -->
			<div class="shop-window">
				<div class="window-horizontal"></div>
				<div class="window-vertical"></div>
			</div>
		</div>

		<!-- LEFT SHELF -->
		 <div class="left-shelf">
			<div class="shelf-row"></div>
			<div class="shelf-row"></div>
			<div class="shelf-row"></div>
		 </div>

		<!-- RIGHT SHELF -->
		 <div class="right-shelf">
			<div class="shelf-row"></div>
			<div class="shelf-row"></div>
			<div class="shelf-row"></div>
		 </div>
		<!-- SHOP COUNTER -->
		 <div class="counter">
			<button class="buy-button" onclick="openShop">BUY!</button>
		 </div>

		<!-- MAIN HUB LINK -->
		<div class="bg-warning text-white">
			<a href="hub.html">
				Click here to go to the main hub!
			</a>
		</div>

	</body>
</html>
