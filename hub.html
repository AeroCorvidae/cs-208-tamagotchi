<!DOCTYPE html>
<html>
	<head>
		<title>Main hub</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
		<link rel="stylesheet" href="hub-styles.css" />
		<link href="test.css" rel="stylesheet" />
		<script src="bootstrap/js/bootstrap.bundle.min.js"></script>
		<script src="Goobert.js" defer></script>
		<script src="test.js" defer></script>
		<script src="hub.js" defer></script>
	</head>
	<body>
		
		<div class="background">
			
			<div class="tree-container">

				<img src="hub-images/gooberts_tree.png" 
					alt="GOOBERTS HUB" 
					class="pixelated-tree" 
					id="goobert-tree">

				<!--CLickable Areas-->
				<div id="tree-body-area"></div>
				<div id="tree-legs-area"></div>
				<div id="tree-mouth-area"></div>
				<div id="tree-eyes-area"></div>
				<div id="tree-body-color"></div>
				<div id="tree-legs-color"></div>


				<!--Goobert Container-->
				<div class="goobert-container">
					<img id="goobert-legs" src="assets/goobert-parts/Transparent-BG.png"/>
					<img id="goobert-body" src="assets/goobert-parts/Transparent-BG.png"/>
					<img id="goobert-mouth" src="assets/goobert-parts/Transparent-BG.png"/>
					<img id="goobert-eyes" src="assets/goobert-parts/Transparent-BG.png"/>
				</div> 
			</div>

			<div class="sleep-door-container">
				<img src="index-images/DreamDoor.webp" alt="BEDROOM" id="sleep-door">
			</div>

			<div class="game-door-container">
				<img src="hub-images/game-door.png" alt="GAME" id="game-door">
			</div>

			<div class="shop-door-container">
				<img src="hub-images/shop-door.png" alt="SHOP" id="shop-door">
			</div>

			<div class="leave-door-container">
				<img src="hub-images/leave-door.png" alt="LEAVE" id="leave-door">
			</div>

		</div>
	</body>
</html>
